<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Profilfach Informatik GWG</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    body {
		margin: 0;
		font-family: "Montserrat", sans-serif;
		background: linear-gradient(135deg, #d1e8ff, #ffedf5);
		color: #222;
		position: relative;
	}

	body::before {
		content: "";
		position: fixed;        /* bleibt immer an der gleichen Stelle */
		top: 0;
		left: 0;
		width: 100vw;           /* volle Breite des Bildschirms */
		height: 100vh;          /* volle Höhe des Bildschirms */
		background: url('schule.jpg') center/cover no-repeat; /* 'cover' füllt den gesamten Bereich */
		opacity: 0.3;           /* Deckkraft anpassen */
		pointer-events: none;   /* Klicks gehen durch */
		z-index: -1;            /* hinter allen Inhalten */
	}

    table {
        width: 90%;
        margin: 3rem auto;
        border-collapse: separate;
        border-spacing: 0 10px;
        background: transparent;
    }

    th, td {
        padding: 1.4rem;
        text-align: center;
        border: 1px solid rgba(0,0,0,0.15);
        font-size: 1.15rem;
        background: #ffffffaa;
        backdrop-filter: blur(10px);
    }

    th {
        border-radius: 8px;
        background: linear-gradient(135deg, #e8f1ff, #f7faff);
        font-weight: 600;
        color: #003366;
    }

    tr td:first-child {
        border-radius: 14px 0 0 14px;
    }
    tr td:last-child {
        border-radius: 0 14px 14px 0;
    }
    tr td:only-child {
        border-radius: 14px;
    }

    .clickable {
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .clickable:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }

    .infosys { background: #b9cbe0; }
    .ti { background: #e3efab; }
    .kt { background: #f8b2b2; }

    /* ---------------------------------------
       📱 MOBILE ANPASSUNG
       --------------------------------------- */
    @media (max-width: 700px) {

        table, thead, tbody, th, td, tr {
            display: block;
            width: 100%;
        }

        thead {
            display: none; /* Überschriften verschwinden */
        }

        tr {
            margin-bottom: 18px;
        }

        td {
            text-align: left;
            padding: 1.1rem 1.3rem;
            position: relative;
            border-radius: 14px !important;
            border: 1px solid rgba(0,0,0,0.15);
        }

        /* 📌 Label für jede Zelle einblenden */
        td::before {
            content: attr(data-label);
            font-weight: 600;
            color: #003366;
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Klickbare Zellen weiter gut bedienbar */
        .clickable:hover {
            transform: none;
            box-shadow: none;
        }
    }
</style>
</head>
<body>

<h1 style="text-align:center; color:#003366; margin-top:2rem;">
    Profilfach Informatik am GWG – Kursübersicht
</h1>

<table>
    <thead>
        <tr>
            <th>Schuljahr 1<br>Einführungsphase</th>
            <th>Schuljahr 2<br>Hauptphase 1 und 2</th>
            <th>Schuljahr 3<br>Hauptphase 3 und 4</th>
            <th>Prüfung</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td colspan="3"
                class="clickable infosys"
                data-label="Kurs"
                onclick="location.href='infosys.html'">
                Informatiksysteme (InfoSys) – Leistungskurs (LK)
            </td>
            <td data-label="Prüfung"><strong>Pflicht</strong></td>
        </tr>

        <tr>
            <td colspan="3"
                class="clickable ti"
                data-label="Kurs"
                onclick="location.href='ti.html'">
                Technische Informatik (TI)
            </td>
            <td data-label="Prüfung"><strong>nach Wahl</strong></td>
        </tr>

        <tr>
            <td data-label="Einführungsphase"></td>
            <td colspan="2"
                class="clickable kt"
                data-label="Kurs"
                onclick="location.href='kt.html'">
                Kommunikationstechnik (KT)
            </td>
            <td data-label="Prüfung"><strong>keine</strong></td>
        </tr>
    </tbody>
</table>

</body>
</html>
